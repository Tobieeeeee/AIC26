# Default configuration — AIC26 MVR Competition
# ===============================================
#
# This file resolves default parameters for all CLI commands and pipeline stages.
# It MUST be aligned with configs/production.yaml (the canonical system-default
# registry). Legacy/experimental values are available only by explicit opt-in.
#
# See also: docs/architecture/CANONICAL_SYSTEM_DEFAULTS.md

ingestion:
  shot_detector: transnetv2
  pyscene_threshold: 27.0
  transnet_threshold: 0.5
  selector:
    mode: periodic
    candidate_step_sec: 1.0
    max_temporal_gap_sec: 8.0
    clip_knn_k: 3
    clip_neighbor_window_sec: 4.0
    clip_novelty_threshold: 0.15
    clip_rare_threshold: 0.25
    min_event_gap_sec: 2.0
    edge_change_mad_multiplier: 3.0
    edge_change_min_score: 0.08
    midpoint_mandatory: true
    metaclip_model: facebook/metaclip-2-worldwide-b16
    metaclip_revision: 8cc8591f32b43a809f3325192d3b77aa56968ddb
  periodic:
    long_threshold_sec: 12.0
    interval_sec: 8.0

enrichment:
  # --- OCR (production: DeepSolo + Vietnamese PARSeq) ---
  ocr_engine: deepsolo
  ocr_detector: deepsolo
  ocr_recognizer: parseq_vietnamese
  ocr_temporal_context: [-1, 0, 1]
  ocr_confidence: 0.0    # Worker-side threshold; post-processing handles filtering
  ocr_text_similarity_threshold: 0.80
  ocr_bbox_iou_threshold: 0.30

  # --- Object detection (production: RF-DETR) ---
  object_detector: rfdetr
  object_confidence: 0.4
  # RF-DETR variant/checkpoint pinning is pending.
  # Legacy Faster R-CNN remains available by explicit --rcnn-model flag.

  # --- Visual embeddings (production: three-provider stack) ---
  embedding_providers:
    - beit3
    - metaclip2
    - perception_encoder
  embedding_batch_size: 32

  # Legacy single-CLIP configuration (explicit opt-in only)
  legacy_clip:
    embedding_model: ViT-B-32
    embedding_pretrained: laion2b_s34b_b79k
    lab6_embedding_model: RN50
    lab6_embedding_pretrained: openai
    lab6_embedding_batch_size: 64

  # --- ASR (production: Silero VAD + ChunkFormer CTC Large Vie) ---
  asr:
    mode: per_keyframe
    sample_rate: 16000
    pre_seconds: 3.0
    post_seconds: 3.0
    vad:
      provider: silero
      threshold: 0.5
      min_speech_duration_ms: 250
      min_silence_duration_ms: 150
      merge_gap_ms: 250
    provider: chunkformer
    model: khanhld/chunkformer-ctc-large-vie
    revision: 14a68262fa5fc6d497cb107c18bc5a9308ef21ca
    device: cpu
    allow_download: false

retrieval:
  lexical_backend: elasticsearch
  semantic_backend: faiss_flat_ip
  candidate_k: 30
  hybrid_method: weighted
  rrf_k: 60
  weighted_alpha: 0.25
  elasticsearch_num_candidates: 100

elasticsearch:
  url: http://localhost:9200
  index: keyframes
  server_version: 8.11.4

api:
  top_k_default: 20
  top_k_max: 100

# Textual KIS. `frame_id` is always an ORIGINAL-video frame index resolved from
# the organizer `map_keyframes` `frame_idx` column, never the `n` ordinal.
kis:
  top_k_default: 100
  top_k_max: 100
  benchmark_top_k: 100
  # Internal candidate pool fetched before original-frame mapping and
  # deduplication: max(top_k * multiplier, floor). Deliberately allowed to
  # exceed top_k_max so mapping/dedup losses cannot starve a Top-100 request.
  overfetch_multiplier: 3
  overfetch_floor: 30
  refinement_enabled: false      # correct but ~205s/query; see AIC_KIS_FINAL_REPORT.md
  refinement_top_n: 3
  refinement_frame_radius: 45
  local_export_format: local_verification_export

# TRAKE (multi-event ordered temporal alignment). Every value below was set
# from the real-data benchmark in docs/AIC_TRAKE_BENCHMARK_RESULTS.md, not
# copied from the course lab: three lab defaults were measured to be actively
# harmful at this system's per-video scope and are documented there.
trake:
  # ATLAS is the evidence-backed default: 0.660 mean final score vs Lucifer's
  # 0.670 (a one-marker difference on a five-query set, i.e. noise) but on a
  # flat parameter plateau instead of Lucifer's min_sim cliff.
  alignment_strategy: atlas
  top_k_default: 100             # competition cap on submitted chains per query
  shortlist_top_k: 500           # per-event search_kis() width, needs the raised kis ceiling

  atlas:
    alpha: 0.01                  # lab default, unchanged
    beta: 0.01                   # lab default, unchanged
    min_sim: 0.0                 # lab default, unchanged
    top_n: 5                     # chains kept per video; plateau 5..20 all score 0.660

  lucifer:
    alpha: 0.01                  # lab default, unchanged
    beta: 0.01                   # lab default, unchanged
    lambda: 0.8                  # lab default, unchanged (per-skip multiplier)
    # CLIFF -- do not nudge without re-running the benchmark: 0.20 -> 0.670,
    # 0.22 -> 0.530, 0.25 -> 0.473. Below 0.20 no skip ever fires and this
    # strategy degenerates into ATLAS. Lab default was 0.05 (unreachable skip).
    min_sim: 0.20
    top_n: 5

  ucese:
    t_win: 20.0                  # lab default, unchanged (window width, seconds)
    # Lab default was 300, which selected hits across the WHOLE corpus. Scoped
    # per-video (~200-320 frames) that made every frame a hit for every event
    # and returned one identical frame for all k events, scoring 0.000.
    topk: 10
    top_n: 5

  first_touch:
    slack: 0.05                  # lab defaults, unchanged; helper is not wired
    floor: 0.15                  # into any strategy (see trake_align.py)
