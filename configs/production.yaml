# Canonical Production System Defaults — AIC26
# ============================================
#
# This file is the authoritative source of truth for production model and
# parameter defaults. Every offline pipeline, CLI command, manifest, and
# downstream task must resolve its defaults from this file.
#
# To experiment with a different configuration, create a separate config file
# (e.g. configs/experiment_xyz.yaml) and pass it explicitly. Do NOT silently
# override these values with hardcoded alternatives.
#
# Frozen at: DATA-02 task
# Schema version: 1.0

schema_version: "1.0"
# Semantic backend migration: FAISS → Milvus (TASK05-MILVUS)
# FAISS is retained as faiss_reference for parity/benchmark testing.

# --------------------------------------------------------------------------
# Ingestion — frozen production contract
# --------------------------------------------------------------------------
ingestion:
  detector: transnetv2
  detector_threshold: 0.5
  selector: periodic
  long_threshold_sec: 12.0
  interval_sec: 8.0

# --------------------------------------------------------------------------
# Object detection — canonical production default
# --------------------------------------------------------------------------
objects:
  provider: rfdetr
  variant: large
  model_class: RFDETRLarge
  checkpoint: rf-detr-large-2026.pth
  checkpoint_bytes: 135954129
  checkpoint_sha256: 0f4e20e19a99c0f8a62b5685f57f6c8b5c371c59081feda6752a0561a79ccf38
  checkpoint_source: https://storage.googleapis.com/rfdetr/rf-detr-large-2026.pth
  package: rfdetr
  package_version: 1.9.3
  source: https://github.com/roboflow/rf-detr
  revision: 3f7748b1783533bc2e62804ca5975fe9b9cfc041
  license: Apache-2.0
  vocabulary: MS COCO 2017
  class_count: 80
  class_id_space: sparse COCO category IDs in 90 model slots
  resolution: 704
  score_threshold: 0.4
  nms: false
  device: cuda
  batch_size: 1
  checkpoint_lock: configs/rfdetr_model.lock.json
  pin_status: pinned
  allow_download: false
  # Legacy backends remain available by explicit opt-in only.
  legacy_backends:
    - faster_rcnn
    - yolov8

# --------------------------------------------------------------------------
# Visual semantic embeddings — canonical three-provider stack
# --------------------------------------------------------------------------
embeddings:
  providers:
    - beit3
    - metaclip2
    - perception_encoder
  # Provider-level pinning is in configs/embedding_providers.json.
  # No vector concatenation across providers.
  # No raw-score addition between providers.
  # One mapping per provider. One manifest per provider.
  # One semantic index namespace per provider.
  provider_specs: configs/embedding_providers.json

# --------------------------------------------------------------------------
# OCR — canonical production stack
# --------------------------------------------------------------------------
ocr:
  detector: deepsolo
  recognizer: parseq_vietnamese
  temporal_context: [-1, 0, 1]
  text_similarity: normalized_levenshtein
  text_similarity_threshold: 0.80
  spatial_similarity: bbox_iou
  bbox_iou_threshold: 0.30
  # Legacy backends available by explicit opt-in only.
  legacy_backends:
    - easyocr
    - paddleocr

# --------------------------------------------------------------------------
# ASR — current production system (unchanged)
# --------------------------------------------------------------------------
asr:
  vad:
    provider: silero
    threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 150
    merge_gap_ms: 250
  recognizer: chunkformer_ctc_large_vie
  model: khanhld/chunkformer-ctc-large-vie
  revision: 14a68262fa5fc6d497cb107c18bc5a9308ef21ca
  sample_rate: 16000
  pre_seconds: 3.0
  post_seconds: 3.0
  device: cpu
  allow_download: false

# --------------------------------------------------------------------------
# R2 / Data platform
# --------------------------------------------------------------------------
r2:
  bucket: null  # Set via R2_BUCKET env var
  endpoint: null  # Set via R2_ENDPOINT env var
  layout:
    raw: "data/raw"
    staging: "data/staging"
    corpus: "data/corpus"

# --------------------------------------------------------------------------
# Local cache
# --------------------------------------------------------------------------
cache:
  directory: ".cache/mvr"
  max_size_gb: 50.0
  eviction_policy: lru

# --------------------------------------------------------------------------
# Retrieval (unchanged from existing)
# --------------------------------------------------------------------------
retrieval:
  lexical_backend: elasticsearch
  semantic_backend: milvus          # production: Milvus (TASK05-MILVUS)
  # Runtime override: MVR_SEMANTIC_BACKEND=faiss_reference (tests/parity only).
  # There is no automatic Milvus -> FAISS fallback.
  candidate_k: 30
  hybrid_method: weighted
  rrf_k: 60
  weighted_alpha: 0.25
  elasticsearch_num_candidates: 100

milvus:
  collection: aic26_keyframes
  index_type: FLAT
  metric: IP
  rrf_k: 60
  provider_fields:
    beit3: beit3_vector
    metaclip2: metaclip2_vector
    perception_encoder: pe_vector

elasticsearch:
  url: http://localhost:9200
  index: keyframes
  server_version: 8.11.4

api:
  top_k_default: 20
  top_k_max: 100

kis:
  top_k_default: 100
  top_k_max: 100
  benchmark_top_k: 100
  overfetch_multiplier: 3
  overfetch_floor: 30
  refinement_enabled: false
  refinement_top_n: 3
  refinement_frame_radius: 45
  local_export_format: local_verification_export
