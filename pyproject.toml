[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvr-competition"
version = "0.1.0"
description = "Modular multimedia video retrieval competition system"
requires-python = ">=3.10"
dependencies = [
    "scenedetect>=0.6.4,<0.8",
    "opencv-python>=4.8,<6",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.7,<3",
    "pytest>=8,<9",
]
api = [
    "fastapi>=0.110,<1",
    "pydantic>=2.5,<3",
    "uvicorn>=0.27,<1",
]
semantic = [
    "faiss-cpu>=1.8,<2",
    "open-clip-torch>=2.24,<4",
    "Pillow>=10,<13",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
]
search = ["elasticsearch>=8,<9"]
ocr = [
    "easyocr>=1.7,<2",
    "paddleocr>=2,<4",
    "paddlepaddle>=2,<4",
]
objects = ["ultralytics>=8,<9"]
asr = [
    "chunkformer==1.2.2",
    "huggingface-hub>=0.28,<2",
    "numpy>=1.26,<3",
    "silero-vad==6.2.1",
    "torch>=2.5.1,<3",
    "torchaudio>=2.5.1,<3",
]
# sentencepiece is required by the Marian tokenizer used for Vietnamese
# query translation; transformers raises at load time without it.
qna = ["transformers>=4.40,<5", "torch>=2.2,<3", "sentencepiece>=0.2,<1"]
beit3 = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "sentencepiece>=0.1.99,<1",
    "timm==0.4.12",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "transformers>=4.39,<5",
]
metaclip2 = [
    "numpy>=1.26,<3",
    "Pillow==11.0.0",
    "sentencepiece==0.2.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.57.1",
]
perception-encoder = [
    "einops==0.8.1",
    "huggingface-hub>=0.28,<2",
    "numpy==2.1.2",
    "Pillow==11.0.0",
    "timm==1.0.15",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
